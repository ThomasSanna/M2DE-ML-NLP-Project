# French translation of the metrics report, read by i18n.py.
# Each key is an English text passed to t() in the code, each value its French translation.
# {placeholders} must match between the two; tests/test_i18n.py checks that every text has
# exactly one translation and that no translation is left unused.

# Page and charts (render.py)
"AI metrics report" = "Rapport des métriques IA"
"Generated {generated} from {source}: {runs} runs, {calls} calls." = "Généré le {generated} à partir de {source} : {runs} exécutions, {calls} appels."
'Every number shows its sample size; "indicative" marks fewer than 20 runs.' = "Chaque nombre indique son effectif ; « indicatif » signale moins de 20 exécutions."
"count" = "nombre"
"{caption} (box: quartiles, line: median)" = "{caption} (boîte : quartiles, trait : médiane)"

# Sample size (stats.py)
"n={n}, indicative" = "n={n}, indicatif"
"{value} (indicative)" = "{value} (indicatif)"

