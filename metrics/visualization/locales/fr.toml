# French translation of the metrics report, read by i18n.py.
# Each key is an English text passed to t() in the code, each value its French translation.
# {placeholders} must match between the two; tests/test_i18n.py checks that every text has
# exactly one translation and that no translation is left unused.

# Page and charts (render.py)
"AI metrics report" = "Rapport des métriques IA"
"Generated {generated} from {source}: {runs} runs, {calls} calls." = "Généré le {generated} à partir de {source} : {runs} exécutions, {calls} appels."
'Every number shows its sample size; "indicative" marks fewer than 20 runs.' = "Chaque nombre indique son effectif ; « indicatif » signale moins de 20 exécutions."
"{reading} Box: middle half of the runs; thick line: median; whiskers: the other runs, up to 1.5 times the box length; each dot is one run." = "{reading} Boîte : la moitié centrale des exécutions ; trait épais : médiane ; moustaches : les autres exécutions, jusqu'à 1,5 fois la longueur de la boîte ; chaque point est une exécution."

# Sample size (stats.py)
"n={n}, indicative" = "n={n}, indicatif"
"{value} (indicative)" = "{value} (indicatif)"

# Configuration label (load.py)
"(no label)" = "(sans label)"
"on" = "activé"
"off" = "désactivé"
"{label} · {model} · steps {steps} · max_tokens {max_tokens} · candidates {candidates} · top_k {top_k} · threshold {threshold} · web {web}" = "{label} · {model} · étapes {steps} · max_tokens {max_tokens} · candidats {candidates} · top_k {top_k} · seuil {threshold} · web {web}"

# Overview (overview.py)
"Overview" = "Vue d'ensemble"
"1 run at {time} UTC." = "1 exécution le {time} UTC."
"{runs} runs between {first} and {last} UTC." = "{runs} exécutions du {first} au {last} UTC."
"{answered} of {runs} runs answered ({pct})." = "Exécutions ayant répondu : {answered} sur {runs} ({pct})."
"Sources: {sources}." = "Sources : {sources}."
"Runs per configuration" = "Exécutions par configuration"
"Runs per source and outcome" = "Exécutions par source et par issue"
"Runs per day, by outcome" = "Exécutions par jour, par issue"
"One bar per day (UTC), split by outcome. answered: the bot replied; embedding_error, reranker_error, llm_error: the run stopped because the embeddings server, the reranker or the language model failed." = "Une barre par jour (UTC), découpée par issue. answered : le bot a répondu ; embedding_error, reranker_error, llm_error : l'exécution s'est arrêtée sur une panne du serveur d'embeddings, du reranker ou du modèle de langage."
"runs" = "exécutions"
"config" = "configuration"
"source" = "source"
"total" = "total"
"first run" = "première exécution"
"last run" = "dernière exécution"

# Configurations (configs.py)
"Configurations" = "Configurations"
"Answered runs per configuration (C1 is the baseline)" = "Exécutions ayant répondu, par configuration (C1 est la référence)"
"No answered run: configurations cannot be compared." = "Aucune exécution n'a répondu : impossible de comparer les configurations."
"Baseline: {config} ({note})." = "Référence : {config} ({note})."
"Only one configuration in the data: nothing to compare." = "Une seule configuration dans les données : rien à comparer."
"No configuration other than the baseline has {count} answered runs: differences are not interpreted." = "Aucune configuration autre que la référence n'a {count} exécutions ayant répondu : les écarts ne sont pas interprétés."
"{config}: median total {total} ({delta} vs baseline), mean tokens {tokens} ({tokens_delta}) ({note})." = "{config} : total médian {total} ({delta} par rapport à la référence), tokens moyens {tokens} ({tokens_delta}) ({note})."
"Total duration per configuration" = "Durée totale par configuration"
"total duration per answered run (s)" = "durée totale par exécution ayant répondu (s)"
"Time from the question to the answer, one row per configuration (C1, C2… are described in the table below). Further left is faster." = "Temps entre la question et la réponse, une ligne par configuration (C1, C2… sont décrites dans le tableau ci-dessous). Plus à gauche, plus rapide."
"id" = "id"
"configuration" = "configuration"
"answered" = "réponses"
"errors" = "erreurs"
"median total" = "total médian"
"p95 total" = "total p95"
"prompt tokens" = "tokens de prompt"
"completion tokens" = "tokens de complétion"
"steps" = "étapes"
"grounded in memory" = "fondées sur la mémoire"

# Latency (latency.py)
"Latency" = "Latence"
"No answered run: no latency breakdown." = "Aucune exécution n'a répondu : pas de répartition de la latence."
"The run closest to the median total ({total}) spends: {shares}." = "L'exécution la plus proche du total médian ({total}) répartit son temps ainsi : {shares}."
"other" = "autre"
"No successful call in the data." = "Aucun appel réussi dans les données."
"Slowest call kind by median duration: {kind}, {duration} ({note})." = "Type d'appel le plus lent en durée médiane : {kind}, {duration} ({note})."
"No consecutive calls in the data." = "Aucun appel consécutif dans les données."
"Median gap between consecutive calls: {gap} ({note})." = "Écart médian entre appels consécutifs : {gap} ({note})."
"No successful model call in the data." = "Aucun appel au modèle réussi dans les données."
"Median generation speed: {speed} tokens/s, prefill included ({note})." = "Vitesse de génération médiane : {speed} tokens/s, prefill inclus ({note})."
"Mean time per answered run by call kind, per configuration (sums to the mean total)" = "Temps moyen par exécution ayant répondu, par type d'appel et par configuration (la somme donne le total moyen)"
"seconds per answered run (mean)" = "secondes par exécution ayant répondu (moyenne)"
"Each bar is the mean answered run of a configuration, cut by what spent the time. embed: embedding the question; vector_search: searching the memory; rerank: scoring the memory candidates; llm: the language model; web_search: Exa; other: time outside remote calls (prompt building, database, parsing)." = "Chaque barre est l'exécution moyenne d'une configuration, découpée selon ce qui a pris le temps. embed : embedding de la question ; vector_search : recherche dans la mémoire ; rerank : notation des candidats de la mémoire ; llm : modèle de langage ; web_search : Exa ; autre : temps hors appels distants (construction du prompt, base de données, parsing)."
"Timeline of the run closest to the median total ({total}): {config}, {started} UTC" = "Chronologie de l'exécution la plus proche du total médian ({total}) : {config}, le {started} UTC"
"Each bar is one call of this run, from its start to its end, in order. Space between two bars is time spent in the API itself; the dashed line marks the answer." = "Chaque barre est un appel de cette exécution, de son début à sa fin, dans l'ordre. L'espace entre deux barres est du temps passé dans l'API elle-même ; les tirets marquent la réponse."
"seconds since the run started" = "secondes depuis le début de l'exécution"
"{kind} (step {step})" = "{kind} (étape {step})"
"Gaps between consecutive calls of a run" = "Écarts entre appels consécutifs d'une exécution"
"gaps" = "écarts"
"Time the API spends between two remote calls of the same run: building the next prompt, database access, parsing. Values near zero mean the API adds almost nothing to the model and search times." = "Temps passé par l'API entre deux appels distants d'une même exécution : construction du prompt suivant, accès à la base, parsing. Des valeurs proches de zéro signifient que l'API n'ajoute presque rien au temps des modèles et des recherches."
"Tokens generated by a call divided by its duration. The duration includes reading the prompt (prefill), so a long prompt lowers this speed even when the model generates at the same pace." = "Tokens générés par un appel divisés par sa durée. La durée inclut la lecture du prompt (prefill) : un long prompt fait donc baisser cette vitesse même si le modèle génère au même rythme."
"ms from the end of a call to the start of the next" = "ms entre la fin d'un appel et le début du suivant"
"Generation speed of successful model calls" = "Vitesse de génération des appels au modèle réussis"
"completion tokens per second, prefill included" = "tokens de complétion par seconde, prefill inclus"
"Duration per call kind" = "Durée par type d'appel"
"kind" = "type"
"calls" = "appels"
"failed" = "en échec"
"median" = "médiane"
"p95" = "p95"
"max" = "max"

# Tokens and cache (tokens.py)
"Tokens and cache" = "Tokens et cache"
"No answered run: no token figures." = "Aucune exécution n'a répondu : pas de chiffres sur les tokens."
"Mean per answered run: {prompt} prompt and {completion} completion tokens ({note})." = "Moyenne par exécution ayant répondu : {prompt} tokens de prompt et {completion} tokens de complétion ({note})."
"Cached tokens are not reported: start vLLM with --enable-prompt-tokens-details to measure the prefix cache." = "Les tokens en cache ne sont pas remontés : lancez vLLM avec --enable-prompt-tokens-details pour mesurer le cache de préfixe."
"Cache rate: {rate} of prompt tokens ({note})." = "Taux de cache : {rate} des tokens de prompt ({note})."
"Mean prompt tokens grow from {first} at step {first_step} to {last} at step {last_step}." = "Les tokens de prompt moyens passent de {first} à l'étape {first_step} à {last} à l'étape {last_step}."
"Prompt and completion tokens per answered run" = "Tokens de prompt et de complétion par exécution ayant répondu"
"prompt tokens (all steps)" = "tokens de prompt (toutes étapes)"
"Thread length against prompt tokens per answered run" = "Longueur du fil et tokens de prompt, par exécution ayant répondu"
"thread length (characters)" = "longueur du fil (caractères)"
"Mean prompt tokens of a model call, by agent step" = "Tokens de prompt moyens d'un appel au modèle, par étape de l'agent"
"agent step" = "étape de l'agent"
"mean prompt tokens" = "tokens de prompt moyens"
"step {step}" = "étape {step}"
"Prefix cache rate per run" = "Taux de cache de préfixe par exécution"
"cached share of prompt tokens (%)" = "part des tokens de prompt servie par le cache (%)"
"Share of a run's prompt tokens that vLLM reused from its prefix cache instead of computing them again. Agent steps resend the same beginning, so a high share saves prefill time." = "Part des tokens de prompt d'une exécution que vLLM a repris de son cache de préfixe au lieu de les recalculer. Les étapes de l'agent renvoient le même début de prompt : une part élevée fait gagner du temps de prefill."
"One dot per answered run, summed over all its model calls. Further right: a larger prompt (more steps, longer thread); higher: more generated text." = "Un point par exécution ayant répondu, cumulé sur tous ses appels au modèle. Plus à droite : un prompt plus gros (plus d'étapes, fil plus long) ; plus haut : plus de texte généré."
"One dot per answered run. Dots rising to the right mean a longer ticket thread makes the prompt grow." = "Un point par exécution ayant répondu. Des points qui montent vers la droite signifient qu'un fil de ticket plus long fait grossir le prompt."
"Each step resends the whole conversation with the previous outputs and search results appended, so the prompt grows from one step to the next." = "Chaque étape renvoie toute la conversation, augmentée des sorties et des résultats de recherche précédents : le prompt grossit donc d'une étape à l'autre."
"Tokens by step" = "Tokens par étape"
"step" = "étape"
"mean prompt" = "prompt moyen"
"max prompt" = "prompt max"
"mean completion" = "complétion moyenne"
"max completion" = "complétion max"

# Agent (agent.py)
"Agent" = "Agent"
"{first} of {answered} answered runs answered at step 1 ({pct}, {note})." = "Réponse dès l'étape 1 : {first} sur {answered} exécutions ayant répondu ({pct}, {note})."
"No model call in the data." = "Aucun appel au modèle dans les données."
"Invalid model outputs: {invalid} of {calls} model calls ({pct})." = "Sorties invalides du modèle : {invalid} sur {calls} appels au modèle ({pct})."
"Responses cut by max_tokens: {cut} of {calls} model calls." = "Réponses coupées par max_tokens : {cut} sur {calls} appels au modèle."
"No web search in the data." = "Aucune recherche web dans les données."
"Web searches: {ok} ok, {failed} failed, {duplicate} duplicate, {unavailable} unavailable, {per_run} per run ({note})." = "Recherches web : {ok} ok, {failed} en échec, {duplicate} en doublon, {unavailable} hors service, {per_run} par exécution ({note})."
"Exa cost: ${total} in total, ${per_run} per run with a search." = "Coût Exa : {total} $ au total, {per_run} $ par exécution avec recherche."
"Runs with dropped refs (cited but never shown to the model): {dropped} of {answered}." = "Exécutions avec des références écartées (citées sans avoir été montrées au modèle) : {dropped} sur {answered}."
"Steps per answered run" = "Étapes par exécution ayant répondu"
"Number of model calls an answered run needed. The agent stops at its step limit (agent_max_steps): a tall last bar means runs used every step allowed." = "Nombre d'appels au modèle dont une exécution ayant répondu a eu besoin. L'agent s'arrête à sa limite d'étapes (agent_max_steps) : une dernière barre haute signifie que des exécutions ont utilisé toutes les étapes permises."
"What each model call asked for. answer: the final reply; search: a web search, followed by another step; invalid: an output that does not follow the expected format, which costs a step." = "Ce que chaque appel au modèle a demandé. answer : la réponse finale ; search : une recherche web, suivie d'une nouvelle étape ; invalid : une sortie qui ne respecte pas le format attendu, ce qui coûte une étape."
"Searches the model asked for. ok: sent to Exa and answered; failed: sent but Exa returned an error; duplicate: same query as earlier in the run, not sent again; unavailable: web search disabled, nothing sent." = "Recherches demandées par le modèle. ok : envoyée à Exa, qui a répondu ; en échec : envoyée, mais Exa a renvoyé une erreur ; en doublon : même requête que plus tôt dans l'exécution, non renvoyée ; hors service : recherche web désactivée, rien n'est envoyé."
