# PoC stack - LDAP + GLPI + memory API
# Usage: docker compose up -d
# GLPI : http://localhost:8080  (auto-installs on first start)
# PLA  : http://localhost:8081  (login DN: cn=admin,dc=example,dc=org)
# LDAP : ldap://localhost:389   (bind: cn=admin,dc=example,dc=org / password in .env)
# API  : http://localhost:8000/docs  (FastAPI; vector memory on PostgreSQL + pgvector)

name: bisgambiglia-poc

# Environment shared by the API and its migration job.
x-api-env: &api-env
  ENVIRONMENT: "${ENVIRONMENT:-dev}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "${POSTGRES_DB}"
  API_KEY: "${API_KEY}"
  GLPI_WEBHOOK_SECRET: "${GLPI_WEBHOOK_SECRET:-}"
  EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL}"
  EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-multilingual-gemma2}"
  LLM_BASE_URL: "${LLM_BASE_URL}"
  LLM_MODEL: "${LLM_MODEL:-google/gemma3-12b-it}"
  LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-512}"
  LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
  RERANKER_BASE_URL: "${RERANKER_BASE_URL}"
  RERANKER_TIMEOUT_SECONDS: "${RERANKER_TIMEOUT_SECONDS:-30}"
  RETRIEVAL_CANDIDATES: "${RETRIEVAL_CANDIDATES:-20}"
  RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-3}"
  RERANK_THRESHOLD: "${RERANK_THRESHOLD:-0.95}"
  EXA_API_KEY: "${EXA_API_KEY:-}"
  EXA_INCLUDE_DOMAINS: "${EXA_INCLUDE_DOMAINS:-}"
  EXA_NUM_RESULTS: "${EXA_NUM_RESULTS:-3}"
  EXA_TIMEOUT_SECONDS: "${EXA_TIMEOUT_SECONDS:-15}"
  AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-3}"

services:
  # ---------------------------------------------------------------- LDAP
  ldap:
    image: osixia/openldap:latest
    container_name: poc-ldap
    hostname: ldap.example.org
    environment:
      LDAP_ORGANISATION: "Organisation de test (exemple)"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD}"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_INSTANCE_AFTER_POWEROFF: "true"
    command: ["--copy-service"]
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    ports:
      - "389:389"
    networks:
      - poc_net
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b '' -s base '(objectclass=*)' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------- phpLDAPadmin
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: poc-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    networks:
      - poc_net
    depends_on:
      ldap:
        condition: service_healthy

  # ------------------------------------------------------------------ DB
  db:
    image: mariadb:11
    container_name: poc-db
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - poc_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------- GLPI
  glpi:
    image: glpi/glpi:11.0.8
    container_name: poc-glpi
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: "${MARIADB_PASSWORD}"
    volumes:
      - glpi_config:/var/glpi/config
      - glpi_files:/var/glpi/files
      - glpi_marketplace:/var/glpi/marketplace
    ports:
      - "8080:80"
    networks:
      - poc_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------- Memory (PostgreSQL + pgvector)
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: poc-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Exposed on the host machine only (local dev, tests, SQL client).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - poc_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------- Schema migrations (one-shot)
  migrate:
    build: ./api
    image: bisgambiglia-poc/api:latest
    container_name: poc-migrate
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    networks:
      - poc_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------- API FastAPI
  api:
    build: ./api
    image: bisgambiglia-poc/api:latest
    container_name: poc-api
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - poc_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ldap_data:
  ldap_config:
  db_data:
  glpi_config:
  glpi_files:
  glpi_marketplace:
  pg_data:

networks:
  poc_net:
    driver: bridge
